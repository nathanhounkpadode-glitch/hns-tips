name: HNS Tips - Daily Auto-Sync

on:
  schedule:
    # Exécution automatique chaque jour à 04:00 UTC (05:00 heure du Bénin)
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Déclenchement manuel en 1 clic possible depuis l'onglet Actions de GitHub

jobs:
  sync-matches:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚡ Exécution du moteur d'auto-synchronisation HNS
        run: |
          python scripts/auto_sync_matches.py

      - name: 🚀 Commit et Déploiement automatique
        run: |
          git config --global user.name "HNS-Tips-AutoBot"
          git config --global user.email "bot@hns-tips.app"
          
          if [ -n "$(git status --porcelain data/matches.json static/js/default-data.js)" ]; then
            git add data/matches.json static/js/default-data.js
            git commit -m "🤖 [HNS-BOT] Auto-sync quotidienne des matchs et horaires [skip ci]"
            git push
            echo "✅ Mises à jour poussées sur GitHub. Vercel redéploie automatiquement !"
          else
            echo "ℹ️ Aucune modification détectée. Données déjà à jour."
          fi
